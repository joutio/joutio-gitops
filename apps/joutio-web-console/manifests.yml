apiVersion: apps/v1
kind: Deployment
metadata:
  name: joutio-web-console
  namespace: joutio-prod
  labels:
    app.kubernetes.io/part-of: joutio
    app: joutio-web-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: joutio-web-console
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: joutio
        app: joutio-web-console
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: joutio-web-console
          image: ghcr.io/joutio/joutio-web-console:1.0.0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: joutio-web-console
  namespace: joutio-prod
  labels:
    app.kubernetes.io/part-of: joutio
    app: joutio-web-console
spec:
  selector:
    app: joutio-web-console
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
