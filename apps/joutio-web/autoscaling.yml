apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: joutio-web
  namespace: joutio-prod
  labels:
    app.kubernetes.io/part-of: joutio
    app: joutio-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: joutio-web
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Nginx statique : pas de connexion persistante, un scale-down doux suffit.
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: joutio-web
  namespace: joutio-prod
  labels:
    app.kubernetes.io/part-of: joutio
    app: joutio-web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: joutio-web
