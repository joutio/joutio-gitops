apiVersion: apps/v1
kind: Deployment
metadata:
  name: joutio-web
  namespace: joutio-prod
  labels:
    app.kubernetes.io/part-of: joutio
    app: joutio-web
spec:
  # Réplicas pilotés par le HPA (apps/joutio-web/autoscaling.yml) — ne pas fixer `replicas` ici.
  selector:
    matchLabels:
      app: joutio-web
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: joutio
        app: joutio-web
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      # Services hors du nœud des données (Postgres, Kafka) : il sature le premier sous charge
      # (campagne #9). Préférence seulement : si l'autre nœud n'a plus de place, on y retourne.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: [postgres, kafka]
      containers:
        - name: joutio-web
          image: ghcr.io/joutio/joutio-web:1.0.0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              # Request relevée : base de calcul du HPA (10m rendait l'utilisation CPU instable).
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: joutio-web
  namespace: joutio-prod
  labels:
    app.kubernetes.io/part-of: joutio
    app: joutio-web
spec:
  selector:
    app: joutio-web
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
