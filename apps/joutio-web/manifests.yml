apiVersion: apps/v1
kind: Deployment
metadata:
  name: joutio-web
  namespace: joutio-prod
  labels:
    app.kubernetes.io/part-of: joutio
    app: joutio-web
spec:
  # Réplicas pilotés par le HPA (apps/joutio-web/autoscaling.yml) — ne pas fixer `replicas` ici.
  selector:
    matchLabels:
      app: joutio-web
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: joutio
        app: joutio-web
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      # Répartit les réplicas sur les 2 nœuds (soft : un nœud seul reste schedulable).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: joutio-web
      containers:
        - name: joutio-web
          image: ghcr.io/joutio/joutio-web:1.0.0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              # Request relevée : base de calcul du HPA (10m rendait l'utilisation CPU instable).
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: joutio-web
  namespace: joutio-prod
  labels:
    app.kubernetes.io/part-of: joutio
    app: joutio-web
spec:
  selector:
    app: joutio-web
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
