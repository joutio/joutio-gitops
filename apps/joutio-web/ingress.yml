apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: joutio-web
  namespace: joutio-prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - app.joutio.com
      secretName: app-joutio-com-tls
  rules:
    - host: app.joutio.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: joutio-web
                port:
                  number: 80
