apiVersion: apps/v1
kind: Deployment
metadata:
  name: joutio-matchmaking
  namespace: joutio-prod
  labels:
    app.kubernetes.io/part-of: joutio
    app.kubernetes.io/component: axon
    app: joutio-matchmaking
spec:
  # 1 réplique : ses groupes chauds sont segmentés (un thread par segment dans le pod). Sur 2 nœuds,
  # un 2ᵉ pod n'ajoute aucun CPU et coûte un saut de publication Kafka entre pods (campagne #9).
  # Le code multi-répliques (rééquilibreur, routage) reste prêt pour un cluster plus grand.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/part-of: joutio
      app: joutio-matchmaking
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: joutio
        app.kubernetes.io/component: axon
        app: joutio-matchmaking
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      # Services hors du nœud des données (Postgres, Kafka) : il sature le premier sous charge
      # (campagne #9). Préférence seulement : si l'autre nœud n'a plus de place, on y retourne.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: [postgres, kafka]
      containers:
        - name: joutio-matchmaking
          image: ghcr.io/joutio/matchmaking:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
          envFrom:
            - configMapRef:
                name: joutio-common-config
            - configMapRef:
                name: joutio-oauth-client-config
            - configMapRef:
                name: joutio-matchmaking-config
            - secretRef:
                name: joutio-matchmaking-secret
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 60
            periodSeconds: 5
          # Sondes tolérantes à la saturation CPU (test charge 1000 parties) : sous charge,
          # /actuator/health peut répondre en plusieurs secondes — seuils serrés = kills en boucle du kubelet.
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          ports:
            - name: http
              containerPort: 8080
            # Bus gRPC entre pods (joutio.axon.grpc.port) : interne au cluster, jamais exposé par un ingress.
            - name: grpc
              containerPort: 8124
---
apiVersion: v1
kind: Service
metadata:
  name: joutio-matchmaking
  namespace: joutio-prod
  labels:
    app.kubernetes.io/part-of: joutio
    app.kubernetes.io/component: axon
    app: joutio-matchmaking
spec:
  selector:
    app.kubernetes.io/part-of: joutio
    app.kubernetes.io/component: axon
    app: joutio-matchmaking
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
    # Publié par la découverte (métadonnée `port.grpc`), lu par les pairs du bus gRPC.
    - name: grpc
      protocol: TCP
      port: 8124
      targetPort: grpc
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: joutio-matchmaking-config
  namespace: joutio-prod
data:
  JOUTIO_DB_NAME: joutio_matchmaking
  # URL publique du serveur OpenAPI (acces via le gateway).
  MICROSERVICE_SWAGGER_SERVER_URL: https://api.joutio.com/matchmaking-service
