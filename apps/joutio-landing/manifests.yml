apiVersion: apps/v1
kind: Deployment
metadata:
  name: joutio-landing
  namespace: joutio-prod
  labels:
    app.kubernetes.io/part-of: joutio
    app: joutio-landing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: joutio-landing
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: joutio
        app: joutio-landing
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: joutio-landing
          image: ghcr.io/joutio/joutio-landing:1.0.0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: joutio-landing
  namespace: joutio-prod
  labels:
    app.kubernetes.io/part-of: joutio
    app: joutio-landing
spec:
  selector:
    app: joutio-landing
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
