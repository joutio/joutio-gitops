# Liens universels go.joutio.com (design/specs/screens/partage.md) : pages publiques du BFF.
# `/.well-known/*` (AASA, assetlinks.json) est servi tel quel ; le reste est préfixé par `/go` côté BFF.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: go-prefix
  namespace: joutio-prod
spec:
  addPrefix:
    prefix: /go
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: joutio-bff-go
  namespace: joutio-prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: joutio-prod-go-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - go.joutio.com
      secretName: go-joutio-com-tls
  rules:
    - host: go.joutio.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: joutio-bff
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: joutio-bff-go-well-known
  namespace: joutio-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - go.joutio.com
      secretName: go-joutio-com-tls
  rules:
    - host: go.joutio.com
      http:
        paths:
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: joutio-bff
                port:
                  number: 80
