apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: joutio-bff
  namespace: joutio-prod
  labels:
    app.kubernetes.io/part-of: joutio
    app: joutio-bff
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: joutio-bff
  # Min 1 au repos (sobriété) : un rollout reste sans coupure (maxSurge), la perte du nœud du pod
  # coupe les sessions STOMP le temps de le replanifier.
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    # Le démarrage d'un pod (Spring, Hibernate, Axon) consomme 5 à 7 fois sa request CPU pendant
    # ~4 min : sans fenêtre, chaque déploiement montait au maximum de réplicas. On ne monte que sur
    # une charge tenue 5 min, d'un pod toutes les 2 min.
    scaleUp:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleDown:
      # Le scale-down ferme les sessions STOMP du pod retiré (reconnexion + folds REST) :
      # fenêtre longue pour ne le faire que sous charge durablement basse.
      stabilizationWindowSeconds: 900
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: joutio-bff
  namespace: joutio-prod
  labels:
    app.kubernetes.io/part-of: joutio
    app: joutio-bff
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: joutio-bff
