apiVersion: apps/v1
kind: Deployment
metadata:
  name: joutio-leaderboard
  namespace: joutio-prod
  labels:
    app.kubernetes.io/part-of: joutio
    app.kubernetes.io/component: axon
    app: joutio-leaderboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: joutio
      app: joutio-leaderboard
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: joutio
        app.kubernetes.io/component: axon
        app: joutio-leaderboard
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: joutio-leaderboard
          image: ghcr.io/joutio/leaderboard:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
          envFrom:
            - configMapRef:
                name: joutio-common-config
            - configMapRef:
                name: joutio-oauth-client-config
            - configMapRef:
                name: joutio-leaderboard-config
            - secretRef:
                name: joutio-leaderboard-secret
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 60
            periodSeconds: 5
          # Sondes tolérantes à la saturation CPU (test charge 1000 parties) : sous charge,
          # /actuator/health peut répondre en plusieurs secondes — seuils serrés = kills en boucle du kubelet.
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: joutio-leaderboard
  namespace: joutio-prod
  labels:
    app.kubernetes.io/part-of: joutio
    app.kubernetes.io/component: axon
    app: joutio-leaderboard
spec:
  selector:
    app.kubernetes.io/part-of: joutio
    app.kubernetes.io/component: axon
    app: joutio-leaderboard
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: joutio-leaderboard-config
  namespace: joutio-prod
data:
  JOUTIO_DB_NAME: joutio_leaderboard
  # URL publique du serveur OpenAPI (acces via le gateway).
  MICROSERVICE_SWAGGER_SERVER_URL: https://api.joutio.com/leaderboard-service
