apiVersion: apps/v1
kind: Deployment
metadata:
  name: joutio-console
  namespace: joutio-prod
  labels:
    app.kubernetes.io/part-of: joutio
    app: joutio-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: joutio
      app: joutio-console
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: joutio
        # Pas de label `app.kubernetes.io/component: axon` : la console n'a PAS de runtime Axon
        # (elle ne doit pas être découverte comme pair des bus distribués).
        app: joutio-console
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: joutio-console
          image: ghcr.io/joutio/console:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
          envFrom:
            - configMapRef:
                name: joutio-common-config
            - configMapRef:
                name: joutio-oauth-client-config
            - configMapRef:
                name: joutio-console-config
            - secretRef:
                name: joutio-console-secret
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: joutio-console
  namespace: joutio-prod
  labels:
    app.kubernetes.io/part-of: joutio
    app: joutio-console
spec:
  selector:
    app.kubernetes.io/part-of: joutio
    app: joutio-console
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: joutio-console-config
  namespace: joutio-prod
data:
  JOUTIO_DB_NAME: joutio_console
