apiVersion: apps/v1
kind: Deployment
metadata:
  name: joutio-identity
  namespace: joutio-prod
  labels:
    app.kubernetes.io/part-of: joutio
    app.kubernetes.io/component: axon
    app: joutio-identity
spec:
  # Réplicas pilotés par le HPA (apps/identity/autoscaling.yml) — ne pas fixer `replicas` ici.
  # Multi-réplique sûr : `JOUTIO_IDENTITY_JWK` est partagé (sealed secret commun, clés de
  # signature identiques) et les sessions/codes/tokens OIDC vivent en JDBC partagé.
  selector:
    matchLabels:
      app.kubernetes.io/part-of: joutio
      app: joutio-identity
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: joutio
        app.kubernetes.io/component: axon
        app: joutio-identity
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      # Répartit les réplicas sur les 2 nœuds (soft : un nœud seul reste schedulable).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: joutio-identity
      containers:
        - name: joutio-identity
          image: ghcr.io/joutio/identity:1.0.1
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
          envFrom:
            - configMapRef:
                name: joutio-common-config
            - configMapRef:
                name: joutio-identity-config
            - secretRef:
                name: joutio-identity-secret
            - secretRef:
                name: joutio-identity-grafana
            - secretRef:
                name: joutio-identity-argocd
            - secretRef:
                name: joutio-identity-mail
            # App Secret Facebook (login social). Optionnel pour ne pas bloquer
            # un rollout si le secret n'a pas encore été scellé.
            - secretRef:
                name: joutio-identity-facebook
                optional: true
          resources:
            requests:
              cpu: 150m
              memory: 448Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 60
            periodSeconds: 5
          # Sondes tolérantes à la saturation CPU (test charge 1000 parties) : sous charge,
          # /actuator/health peut répondre en plusieurs secondes — seuils serrés = kills en boucle du kubelet.
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: joutio-identity
  namespace: joutio-prod
  labels:
    app.kubernetes.io/part-of: joutio
    app.kubernetes.io/component: axon
    app: joutio-identity
spec:
  selector:
    app.kubernetes.io/part-of: joutio
    app.kubernetes.io/component: axon
    app: joutio-identity
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: joutio-identity-config
  namespace: joutio-prod
data:
  # Clés spécifiques à identity ; le reste (DB host/port/user, Kafka, K8s, tracing,
  # hikari, springdoc) provient de `joutio-common-config`.
  JOUTIO_DB_NAME: joutio_identity
  # OIDC : issuer public vu par le navigateur (doit matcher l'authority de la SPA).
  JOUTIO_IDENTITY_ISSUER: https://identity.joutio.com
  JOUTIO_APP_LOGIN_URI: https://app.joutio.com/login
  JOUTIO_APP_OAUTH2_SUCCESS_URI: https://app.joutio.com/login?social=success
  JOUTIO_APP_OAUTH2_FAILURE_URI: https://app.joutio.com/login?error
  JOUTIO_CORS_ALLOWED_ORIGINS: https://app.joutio.com,https://api.joutio.com,https://console.joutio.com
  JOUTIO_SESSION_COOKIE_SECURE: "true"
  # Swagger : URL publique via le gateway.
  MICROSERVICE_SWAGGER_SERVER_URL: https://api.joutio.com/identity-service
  # Client OAuth2 sortant `server-client` (client_credentials), avec SON secret.
  SPRING_APPLICATION_JSON: >-
    {"spring":{"security":{"oauth2":{"client":{"registration":{"server-client":{"provider":"joutio-identity","client-id":"server","client-secret":"${JOUTIO_IDENTITY_SERVER_CLIENT_SECRET}","authorization-grant-type":"client_credentials","scope":"openid"}},"provider":{"joutio-identity":{"token-uri":"http://joutio-identity.joutio-prod.svc.cluster.local/oauth2/token","jwk-set-uri":"http://joutio-identity.joutio-prod.svc.cluster.local/oauth2/jwks"}}}}}}}
  # Seeding : crée le compte système unique (admin + bot), sans credential.
  JOUTIO_SEED_DATA_ENABLED: "true"
  # Liste blanche d'emails obtenant ROLE_ADMIN (Grafana).
  JOUTIO_ADMIN_EMAILS: c.nadjim@gmail.com
  # Facebook Login : désactivé tant que l'app Meta n'existe pas. Ne pas mettre une valeur
  # vide : Spring refuse un client-id vide et identity ne démarre pas. Le défaut
  # `joutio-facebook-app-id` de application.yml sert de placeholder.
  # JOUTIO_OAUTH2_FACEBOOK_CLIENT_ID: "<app-id>"
  # Emails transactionnels (codes de connexion OTP) via Resend.
  # La clé API est portée par le secret joutio-identity-mail.
  JOUTIO_MAIL_FROM: Joutio <no-reply@joutio.com>
  JOUTIO_MAIL_BASE_URL: https://api.resend.com
