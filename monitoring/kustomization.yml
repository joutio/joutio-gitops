apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Pas de transformeur `namespace:` global : les ServiceMonitors d'application doivent vivre
# dans `joutio-prod` (un ServiceMonitor ne peut sélectionner que des Services de son namespace).
resources:
  - service-monitors.yml
  - probes.yml
  - prometheus-rules.yml
  - alertmanager-config.yml
  - kafka-exporter.yml
  - postgres-exporter.yml
  - dashboards/00-overview.yml
  - dashboards/01-slo.yml
  - dashboards/10-service.yml
  - dashboards/11-bff-realtime.yml
  - dashboards/20-axon.yml
  - dashboards/30-product.yml
  - dashboards/40-infra-cluster.yml
  - dashboards/41-infra-data.yml
  - dashboards/42-infra-observability.yml
  - dashboards/50-logs.yml
  - dashboards/90-loadtest.yml
  - grafana-datasources.yml
