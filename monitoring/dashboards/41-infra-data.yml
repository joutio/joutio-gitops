              "expr": "sum(increase(pg_stat_database_blks_hit{datname=~\"$datname\"}[$__range])) / clamp_min(sum(increase(pg_stat_database_blks_hit{datname=~\"$datname\"}[$__range])) + sum(increase(pg_stat_database_blks_read{datname=~\"$datname\"}[$__range])), 1)",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.95
                  },
                  {
                    "color": "green",
                    "value": 0.99
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
