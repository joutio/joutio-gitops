# Postgres (par base, pg_stat_statements), Kafka, MinIO.
# Le JSON ci-dessous est la source du dashboard : le modifier ici (un export Grafana se recolle tel quel).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-41-infra-data
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: joutio
  annotations:
    grafana_folder: "Infra"
data:
  41-infra-data.json: |
    {
      "uid": "joutio-infra-data",
      "title": "41 · Infra — données",
      "description": "Postgres (par base et par requête), Kafka, MinIO.",
      "tags": [
        "joutio",
        "infra",
        "postgres",
        "kafka"
      ],
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "version": 1,
      "timezone": "browser",
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Source",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "prometheus"
            },
            "hide": 0,
            "refresh": 1
          },
          {
            "name": "datname",
            "label": "Base",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(pg_stat_database_xact_commit{datname=~\"joutio.*|postgres\"}, datname)",
              "refId": "datname"
            },
            "definition": "label_values(pg_stat_database_xact_commit{datname=~\"joutio.*|postgres\"}, datname)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "regex": "",
            "hide": 0,
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "links": [
        {
          "title": "Dashboards Joutio",
          "type": "dashboards",
          "tags": [
            "joutio"
          ],
          "asDropdown": true,
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false,
          "icon": "external link"
        }
