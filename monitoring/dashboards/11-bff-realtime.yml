# WebSocket et STOMP du BFF.
# Le JSON ci-dessous est la source du dashboard : le modifier ici (un export Grafana se recolle tel quel).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-11-bff-realtime
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: joutio
  annotations:
    grafana_folder: "Services"
data:
  11-bff-realtime.json: |
    {
      "uid": "joutio-bff-realtime",
      "title": "11 · BFF temps réel",
      "description": "WebSocket et STOMP du BFF : handshakes, executors de messages, réponses tardives.",
      "tags": [
        "joutio",
        "service",
        "bff"
      ],
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "version": 1,
      "timezone": "browser",
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          },
          {
            "name": "Déploiements",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "enable": true,
            "iconColor": "blue",
            "expr": "count by (application, version) (process_start_time_seconds{namespace=\"joutio-prod\", application=\"joutio-bff\"}) unless count by (application, version) (process_start_time_seconds{namespace=\"joutio-prod\", application=\"joutio-bff\"} offset 5m)",
            "step": "5m",
            "titleFormat": "Déploiement {{application}}",
            "textFormat": "version {{version}}",
            "tagKeys": "application"
          }
        ]
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Source",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "prometheus"
            },
            "hide": 0,
            "refresh": 1
          },
          {
            "name": "pod",
            "label": "Pod",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(process_start_time_seconds{application=\"joutio-bff\"}, pod)",
              "refId": "pod"
            },
            "definition": "label_values(process_start_time_seconds{application=\"joutio-bff\"}, pod)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "regex": "",
            "hide": 0,
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "links": [
        {
          "title": "Dashboards Joutio",
          "type": "dashboards",
          "tags": [
            "joutio"
          ],
          "asDropdown": true,
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false,
          "icon": "external link"
        }
      ],
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Connexions",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Handshakes WebSocket /s par statut",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (status) (rate(http_server_requests_seconds_count{application=\"joutio-bff\", pod=~\"$pod\", uri=~\"/ws.*\"}[5m]))",
              "legendFormat": "{{status}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ],
              "showLegend": true,
              "sortBy": "Max",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "id": 2,
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 12,
            "h": 8
          }
        },
        {
          "type": "timeseries",
          "title": "Réponses de duel refusées (après échéance + 1 s de grâce)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (pod) (increase(joutio_duel_answers_late_total{application=\"joutio-bff\", pod=~\"$pod\"}[5m]))",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "lineWidth": 1,
                "fillOpacity": 60,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ],
              "showLegend": true,
              "sortBy": "Max",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "id": 3,
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 12,
            "h": 8
          }
        },
        {
          "id": 4,
          "type": "row",
          "title": "Canaux STOMP (executors Spring)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 9,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Threads actifs",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (name) (executor_active_threads{application=\"joutio-bff\", pod=~\"$pod\", name=~\"clientInbound.*|clientOutbound.*|broker.*|messageBroker.*\"})",
              "legendFormat": "{{name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ],
              "showLegend": true,
              "sortBy": "Max",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "id": 5,
          "gridPos": {
            "x": 0,
            "y": 10,
            "w": 8,
            "h": 8
          }
        },
        {
          "type": "timeseries",
          "title": "Tâches en file",
          "description": "Une file qui grossit sur clientOutbound : les clients lents retardent l'envoi des messages.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (name) (executor_queued_tasks{application=\"joutio-bff\", pod=~\"$pod\", name=~\"clientInbound.*|clientOutbound.*|broker.*|messageBroker.*\"})",
              "legendFormat": "{{name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ],
              "showLegend": true,
              "sortBy": "Max",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "id": 6,
          "gridPos": {
            "x": 8,
            "y": 10,
            "w": 8,
            "h": 8
          }
        },
        {
          "type": "timeseries",
          "title": "Messages traités /s",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (name) (rate(executor_completed_tasks_total{application=\"joutio-bff\", pod=~\"$pod\", name=~\"clientInbound.*|clientOutbound.*|broker.*|messageBroker.*\"}[5m]))",
              "legendFormat": "{{name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ],
              "showLegend": true,
              "sortBy": "Max",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "id": 7,
          "gridPos": {
            "x": 16,
            "y": 10,
            "w": 8,
            "h": 8
          }
        },
        {
          "id": 8,
          "type": "row",
          "title": "Ressources",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 18,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "CPU par pod",
          "description": "Détail complet du service : 10 · Service avec application = joutio-bff.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (pod) (node_namespace_pod_container:container_cpu_usage_seconds_total:sum_rate5m{namespace=\"joutio-prod\", container=\"joutio-bff\", pod=~\"$pod\"})",
              "legendFormat": "{{pod}}"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_horizontalpodautoscaler_status_current_replicas{namespace=\"joutio-prod\", horizontalpodautoscaler=\"joutio-bff\"})",
              "legendFormat": "réplicas HPA"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "réplicas HPA"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "short"
                  },
                  {
                    "id": "custom.axisPlacement",
                    "value": "right"
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ],
              "showLegend": true,
              "sortBy": "Max",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "id": 9,
          "gridPos": {
            "x": 0,
            "y": 19,
            "w": 12,
            "h": 8
          }
        },
        {
          "type": "timeseries",
          "title": "Threads vivants par pod",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (pod) (jvm_threads_live_threads{application=\"joutio-bff\", pod=~\"$pod\"})",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ],
              "showLegend": true,
              "sortBy": "Max",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "id": 10,
          "gridPos": {
            "x": 12,
            "y": 19,
            "w": 12,
            "h": 8
          }
        }
      ]
    }
