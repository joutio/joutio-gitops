# Un service et ses pods : HTTP, ressources, JVM, Hikari, appels sortants, logs.
# Le JSON ci-dessous est la source du dashboard : le modifier ici (un export Grafana se recolle tel quel).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-10-service
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: joutio
  annotations:
    grafana_folder: "Services"
data:
  10-service.json: |
    {
      "uid": "joutio-service",
      "title": "10 · Service",
      "description": "Un service et ses pods : trafic, ressources, JVM, Hikari, appels sortants, logs.",
      "tags": [
        "joutio",
        "service"
      ],
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "version": 1,
      "timezone": "browser",
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          },
          {
            "name": "Déploiements",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "enable": true,
            "iconColor": "blue",
            "expr": "count by (application, version) (process_start_time_seconds{namespace=\"joutio-prod\", application=\"$application\"}) unless count by (application, version) (process_start_time_seconds{namespace=\"joutio-prod\", application=\"$application\"} offset 5m)",
            "step": "5m",
            "titleFormat": "Déploiement {{application}}",
            "textFormat": "version {{version}}",
            "tagKeys": "application"
          }
        ]
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Source",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "prometheus"
            },
            "hide": 0,
            "refresh": 1
          },
          {
            "name": "application",
            "label": "Service",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(process_start_time_seconds{namespace=\"joutio-prod\"}, application)",
              "refId": "application"
            },
            "definition": "label_values(process_start_time_seconds{namespace=\"joutio-prod\"}, application)",
            "refresh": 2,
            "sort": 1,
            "multi": false,
            "includeAll": false,
            "regex": "",
            "hide": 0,
            "current": {
              "text": "joutio-bff",
              "value": "joutio-bff"
            }
          },
          {
            "name": "pod",
            "label": "Pod",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(process_start_time_seconds{namespace=\"joutio-prod\", application=~\"$application\"}, pod)",
              "refId": "pod"
            },
            "definition": "label_values(process_start_time_seconds{namespace=\"joutio-prod\", application=~\"$application\"}, pod)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "regex": "",
            "hide": 0,
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "links": [
        {
          "title": "Dashboards Joutio",
          "type": "dashboards",
          "tags": [
            "joutio"
          ],
          "asDropdown": true,
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false,
          "icon": "external link"
        }
      ],
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Instances",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "Pods prêts / demandés",
          "description": "",
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_deployment_status_replicas_ready{namespace=\"joutio-prod\", deployment=\"$application\"})",
              "legendFormat": "prêts"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_deployment_spec_replicas{namespace=\"joutio-prod\", deployment=\"$application\"})",
              "legendFormat": "demandés"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "value_and_name",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "id": 2,
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          }
        },
        {
          "type": "stat",
          "title": "Redémarrages 24 h",
          "description": "",
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"joutio-prod\", container=\"$application\", pod=~\"$pod\"}[24h])) or vector(0)",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 3
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "id": 3,
          "gridPos": {
            "x": 6,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          }
        },
        {
          "type": "stat",
          "title": "Version",
          "description": "",
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count by (version) (process_start_time_seconds{application=\"$application\", pod=~\"$pod\"})",
              "legendFormat": "{{version}}",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "name",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "id": 4,
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          }
        },
        {
          "type": "stat",
          "title": "Uptime (plus récent)",
          "description": "",
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "time() - max(process_start_time_seconds{application=\"$application\", pod=~\"$pod\"})",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "id": 5,
          "gridPos": {
            "x": 18,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          }
        },
        {
          "id": 6,
          "type": "row",
          "title": "Trafic HTTP (hors actuator)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Requêtes /s par route (top 10)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "topk(10, sum by (method, uri) (http:requests:rate5m{application=\"$application\", pod=~\"$pod\"}))",
              "legendFormat": "{{method}} {{uri}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ],
              "showLegend": true,
              "sortBy": "Max",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "id": 7,
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 12,
            "h": 8
          }
        },
        {
          "type": "timeseries",
          "title": "Requêtes /s par pod",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (pod) (http:requests:rate5m{application=\"$application\", pod=~\"$pod\"})",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ],
              "showLegend": true,
              "sortBy": "Max",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "id": 8,
          "gridPos": {
            "x": 12,
            "y": 6,
            "w": 12,
            "h": 8
          }
        },
        {
          "type": "timeseries",
          "title": "Erreurs par statut",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (status, uri) (http:requests:rate5m{application=\"$application\", pod=~\"$pod\", status=~\"[45]..\"}) > 0",
              "legendFormat": "{{status}} {{uri}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ],
              "showLegend": true,
              "sortBy": "Max",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "id": 9,
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 12,
            "h": 8
          }
        },
        {
          "type": "timeseries",
          "title": "Latence p95 par route (top 10)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "topk(10, histogram_quantile(0.95, sum by (le, uri) (http:requests_seconds_bucket:rate5m{application=\"$application\"})))",
              "legendFormat": "{{uri}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "thresholdsStyle": {
                  "mode": "dashed"
                }
              },
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.5
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ],
              "showLegend": true,
              "sortBy": "Max",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "id": 10,
          "gridPos": {
            "x": 12,
            "y": 14,
            "w": 12,
            "h": 8
          }
        },
        {
          "type": "timeseries",
          "title": "Actuator et sondes /s",
          "description": "Coût de fond : sondes kubelet, scrapes Prometheus, discovery.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (uri) (rate(http_server_requests_seconds_count{application=\"$application\", pod=~\"$pod\", uri=~\"/actuator.*\"}[5m]))",
              "legendFormat": "{{uri}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ],
              "showLegend": true,
              "sortBy": "Max",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "id": 11,
          "gridPos": {
            "x": 0,
            "y": 22,
            "w": 12,
            "h": 8
          }
        },
        {
          "type": "timeseries",
          "title": "Appels HTTP sortants /s",
          "description": "Bus de commandes, discovery, agent console, push, appels inter-services : la part de fond au repos se lit ici.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (client_name, uri, status) (rate(http_client_requests_seconds_count{application=\"$application\", pod=~\"$pod\"}[5m]))",
              "legendFormat": "{{client_name}} {{uri}} {{status}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ],
              "showLegend": true,
              "sortBy": "Max",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "id": 12,
          "gridPos": {
            "x": 12,
            "y": 22,
            "w": 12,
            "h": 8
          }
        },
        {
          "type": "timeseries",
          "title": "Durée moyenne des appels sortants",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (client_name, uri) (rate(http_client_requests_seconds_sum{application=\"$application\", pod=~\"$pod\"}[5m])) / sum by (client_name, uri) (rate(http_client_requests_seconds_count{application=\"$application\", pod=~\"$pod\"}[5m]))",
              "legendFormat": "{{client_name}} {{uri}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ],
              "showLegend": true,
              "sortBy": "Max",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "id": 13,
          "gridPos": {
            "x": 0,
            "y": 30,
            "w": 12,
            "h": 8
          }
        },
        {
          "id": 14,
          "type": "row",
          "title": "CPU et mémoire du conteneur",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 38,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "CPU par pod (request et limit en pointillés)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (pod) (node_namespace_pod_container:container_cpu_usage_seconds_total:sum_rate5m{namespace=\"joutio-prod\", container=\"$application\", pod=~\"$pod\"})",
              "legendFormat": "{{pod}}"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(kube_pod_container_resource_requests{namespace=\"joutio-prod\", container=\"$application\", resource=\"cpu\"})",
              "legendFormat": "request"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(kube_pod_container_resource_limits{namespace=\"joutio-prod\", container=\"$application\", resource=\"cpu\"})",
              "legendFormat": "limit"
            }
          ],
          "fieldConfig": {
