# Campagnes de charge k6.
# Le JSON ci-dessous est la source du dashboard : le modifier ici (un export Grafana se recolle tel quel).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-90-loadtest
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: joutio
  annotations:
    grafana_folder: "Tests"
data:
  90-loadtest.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": [
        "joutio",
        "loadtest"
      ],
      "title": "90 · Test de charge",
      "uid": "joutio-loadtest",
      "version": 1,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timezone": "browser",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Source",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "prometheus"
            },
            "hide": 0,
            "refresh": 1
          },
          {
            "name": "run",
            "label": "Campagne",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(k6_vus, run)",
              "refId": "run"
            },
            "definition": "label_values(k6_vus, run)",
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "refresh": 2,
            "sort": 2
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Charge injectée (k6)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Utilisateurs virtuels",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (scenario) (k6_vus{run=~\"$run\"})",
              "legendFormat": "{{scenario}}"
            },
            {
              "refId": "B",
              "expr": "sum(k6_vus{run=~\"$run\"})",
              "legendFormat": "total"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Requêtes /s par route (top 12)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(12, sum by (name) (rate(k6_http_reqs_total{run=~\"$run\"}[1m])))",
              "legendFormat": "{{name}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Échecs HTTP",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (name) (k6_http_req_failed_rate{run=~\"$run\"}) > 0",
              "legendFormat": "{{name}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Latence HTTP p95 par route (top 12)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 9
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(12, max by (name) (k6_http_req_duration_p95{run=~\"$run\"}))",
              "legendFormat": "{{name}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Erreurs de parcours",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 9
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (step) (rate(k6_flow_errors_total{run=~\"$run\"}[1m]))",
              "legendFormat": "{{step}}"
            },
            {
              "refId": "B",
              "expr": "sum(rate(k6_answer_errors_total{run=~\"$run\"}[1m]))",
              "legendFormat": "réponses refusées"
            }
          ]
        },
        {
          "id": 7,
          "type": "row",
          "title": "Signaux d'architecture (SLO de campagne)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 17
          },
          "panels": []
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Préparation de salle p95 (room-saga)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 18
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max by (kind) (k6_room_prepare_p95{run=~\"$run\"})",
              "legendFormat": "{{kind}}"
            }
          ],
          "description": "Création de salle → ROOM_COMPLETED. Seuil 5 s : au-delà, la room-saga (requêtes profils/questions synchrones) décroche."
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Appariement p95",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 18
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max by (vsBot) (k6_matchmaking_wait_p95{run=~\"$run\"})",
              "legendFormat": "vsBot={{vsBot}}"
            }
          ],
          "description": "Ticket → MATCHED (seuil 15 s)."
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Inscription → profil p95 (saga profil)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 18
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(k6_register_to_profile_p95{run=~\"$run\"})",
              "legendFormat": "p95"
            }
          ],
          "description": "1er login OTP → /api/me avec pseudonyme : lag Kafka + CreateProfileSaga (seuil 5 s)."
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Dérive des rounds p95 (deadlines)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 26
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max by (kind) (k6_round_drift_p95{run=~\"$run\"})",
              "legendFormat": "{{kind}}"
            }
          ],
          "description": "ROUND_STARTED reçu − horaire annoncé (firstRoundAt/nextRoundAt) : db-scheduler + fan-out (seuil 1 s)."
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Réponse → écho STOMP p95",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 26
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max by (kind) (k6_answer_ack_p95{run=~\"$run\"})",
              "legendFormat": "{{kind}}"
            }
          ],
          "description": "POST answer → PLAYER_ANSWERED du joueur : commande Axon → événement → Kafka → BFF → STOMP (seuil 1,5 s)."
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Latence de push p95",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 26
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(k6_push_latency_p95{run=~\"$run\"})",
              "legendFormat": "p95"
            },
            {
              "refId": "B",
              "expr": "max(k6_push_latency_max{run=~\"$run\"})",
              "legendFormat": "max"
            }
          ],
          "description": "Réception d'une trame − horodatage serveur de l'événement (seuil 1 s)."
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Duels terminés / appariements humains",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 34
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 1
              },
              "max": 1,
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max by (kind) (k6_duel_completed_rate{run=~\"$run\"})",
              "legendFormat": "terminés {{kind}}"
            },
            {
              "refId": "B",
              "expr": "max(k6_pvp_matched_rate{run=~\"$run\"})",
              "legendFormat": "PvP humain"
            }
          ]
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "WebSocket et présence : incidents /s",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 34
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(k6_ws_unexpected_close_total{run=~\"$run\"}[1m]))",
              "legendFormat": "fermetures serveur"
            },
            {
              "refId": "B",
              "expr": "sum(rate(k6_stomp_errors_total{run=~\"$run\"}[1m]))",
              "legendFormat": "ERROR STOMP"
            },
            {
              "refId": "C",
              "expr": "sum(rate(k6_network_drops_total{run=~\"$run\"}[1m]))",
              "legendFormat": "coupures simulées"
            },
            {
              "refId": "D",
              "expr": "sum by (type) (rate(k6_presence_refused_total{run=~\"$run\"}[1m]))",
              "legendFormat": "entrée refusée {{type}}"
            }
          ]
        },
        {
          "type": "text",
          "title": "Cluster sous charge",
          "gridPos": {
            "x": 0,
            "y": 42,
            "w": 24,
            "h": 3
          },
          "options": {
            "mode": "markdown",
            "content": "Pendant une campagne, garder la même plage de temps et ouvrir : [40 · Infra — cluster](/d/joutio-infra-cluster) (CPU par nœud et par pod, HPA), [20 · Axon](/d/joutio-axon) (processors, lag, commandes p95), [41 · Infra — données](/d/joutio-infra-data) (connexions et requêtes Postgres, Kafka), [10 · Service](/d/joutio-service) (JVM, Hikari)."
          },
          "id": 16
        }
      ],
      "links": [
        {
          "title": "Dashboards Joutio",
          "type": "dashboards",
          "tags": [
            "joutio"
          ],
          "asDropdown": true,
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false,
          "icon": "external link"
        }
      ],
      "description": "Campagnes k6 (remote write) : charge injectée et signaux d'architecture."
    }
