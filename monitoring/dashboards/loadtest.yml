apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-loadtest
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: joutio
data:
  loadtest.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": [
        "joutio",
        "loadtest"
      ],
      "title": "Joutio — Test de charge",
      "uid": "joutio-loadtest",
      "version": 1,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timezone": "browser",
      "templating": {
        "list": [
          {
            "name": "run",
            "label": "Campagne",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(k6_vus, run)",
              "refId": "run"
            },
            "definition": "label_values(k6_vus, run)",
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "refresh": 2,
            "sort": 2
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Charge injectée (k6)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Utilisateurs virtuels",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (scenario) (k6_vus{run=~\"$run\"})",
              "legendFormat": "{{scenario}}"
            },
            {
              "refId": "B",
              "expr": "sum(k6_vus{run=~\"$run\"})",
              "legendFormat": "total"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Requêtes /s par route (top 12)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(12, sum by (name) (rate(k6_http_reqs_total{run=~\"$run\"}[1m])))",
              "legendFormat": "{{name}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Échecs HTTP",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
