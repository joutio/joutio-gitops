# Nœuds et consommation par namespace et par pod.
# Le JSON ci-dessous est la source du dashboard : le modifier ici (un export Grafana se recolle tel quel).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-40-infra-cluster
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: joutio
  annotations:
    grafana_folder: "Infra"
data:
  40-infra-cluster.json: |
    {
      "uid": "joutio-infra-cluster",
      "title": "40 · Infra — cluster",
      "description": "Qui consomme quoi : nœuds (CPU par mode, charge, pression, disque) puis namespaces et pods.",
      "tags": [
        "joutio",
        "infra"
      ],
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "version": 1,
      "timezone": "browser",
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Source",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "prometheus"
            },
            "hide": 0,
            "refresh": 1
          },
          {
            "name": "node",
            "label": "Nœud",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(kube_node_info, node)",
              "refId": "node"
            },
            "definition": "label_values(kube_node_info, node)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "regex": "",
            "hide": 0,
            "current": {
              "text": "All",
              "value": "$__all"
            }
          },
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(kube_pod_info, namespace)",
              "refId": "namespace"
            },
            "definition": "label_values(kube_pod_info, namespace)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "regex": "",
            "hide": 0,
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "links": [
        {
          "title": "Dashboards Joutio",
          "type": "dashboards",
          "tags": [
            "joutio"
          ],
          "asDropdown": true,
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false,
          "icon": "external link"
        }
      ],
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Nœuds",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "CPU par mode — $node",
          "description": "user = applications, system/softirq = noyau et réseau, iowait = attente disque, steal = hyperviseur.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (mode) (rate(node_cpu_seconds_total{mode!=\"idle\"}[5m]) * on (instance) group_left (nodename) node_uname_info{nodename=~\"$node\"})",
              "legendFormat": "{{mode}}"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(node_cpu_seconds_total{mode=\"idle\"} * on (instance) group_left (nodename) node_uname_info{nodename=~\"$node\"})",
              "legendFormat": "cœurs"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              },
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "cœurs"
                },
                "properties": [
                  {
                    "id": "custom.stacking",
                    "value": {
                      "mode": "none"
                    }
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 0
                  },
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        10
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ],
              "showLegend": true,
              "sortBy": "Max",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "repeat": "node",
          "repeatDirection": "h",
          "maxPerRow": 2,
          "id": 2,
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 12,
            "h": 8
          }
        },
        {
          "type": "timeseries",
          "title": "Charge 1/5/15 min et cœurs",
          "description": "Le load average Linux compte aussi les tâches en attente disque (état D) : comparer avec iowait et la pression IO.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "avg by (nodename) (node_load1 * on (instance) group_left (nodename) node_uname_info{nodename=~\"$node\"})",
              "legendFormat": "{{nodename}} 1 min"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "avg by (nodename) (node_load5 * on (instance) group_left (nodename) node_uname_info{nodename=~\"$node\"})",
              "legendFormat": "{{nodename}} 5 min"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "avg by (nodename) (node_load15 * on (instance) group_left (nodename) node_uname_info{nodename=~\"$node\"})",
              "legendFormat": "{{nodename}} 15 min"
            },
            {
              "refId": "D",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count by (nodename) (node_cpu_seconds_total{mode=\"idle\"} * on (instance) group_left (nodename) node_uname_info{nodename=~\"$node\"})",
              "legendFormat": "{{nodename}} cœurs"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ],
              "showLegend": true,
              "sortBy": "Max",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "id": 3,
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 12,
            "h": 8
          }
        },
        {
          "type": "timeseries",
          "title": "Pression (PSI) : part du temps où des tâches attendent",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (nodename) (rate(node_pressure_cpu_waiting_seconds_total[5m]) * on (instance) group_left (nodename) node_uname_info{nodename=~\"$node\"})",
              "legendFormat": "{{nodename}} CPU"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (nodename) (rate(node_pressure_memory_waiting_seconds_total[5m]) * on (instance) group_left (nodename) node_uname_info{nodename=~\"$node\"})",
              "legendFormat": "{{nodename}} mémoire"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (nodename) (rate(node_pressure_io_waiting_seconds_total[5m]) * on (instance) group_left (nodename) node_uname_info{nodename=~\"$node\"})",
              "legendFormat": "{{nodename}} IO"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ],
              "showLegend": true,
              "sortBy": "Max",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "id": 4,
          "gridPos": {
            "x": 0,
            "y": 9,
            "w": 12,
            "h": 8
          }
        },
        {
          "type": "timeseries",
          "title": "Changements de contexte et interruptions /s",
          "description": "Beaucoup de threads qui se réveillent pour rien (polling) font monter les context switches sans CPU utile.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (nodename) (rate(node_context_switches_total[5m]) * on (instance) group_left (nodename) node_uname_info{nodename=~\"$node\"})",
              "legendFormat": "{{nodename}} context switches"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (nodename) (rate(node_intr_total[5m]) * on (instance) group_left (nodename) node_uname_info{nodename=~\"$node\"})",
              "legendFormat": "{{nodename}} interruptions"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ],
              "showLegend": true,
              "sortBy": "Max",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "id": 5,
          "gridPos": {
            "x": 12,
            "y": 9,
            "w": 12,
            "h": 8
          }
        },
        {
          "type": "timeseries",
          "title": "Mémoire par nœud",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (nodename) ((node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) * on (instance) group_left (nodename) node_uname_info{nodename=~\"$node\"})",
              "legendFormat": "{{nodename}} utilisée"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (nodename) ((node_memory_Cached_bytes + node_memory_Buffers_bytes) * on (instance) group_left (nodename) node_uname_info{nodename=~\"$node\"})",
              "legendFormat": "{{nodename}} cache"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (nodename) (node_memory_MemTotal_bytes * on (instance) group_left (nodename) node_uname_info{nodename=~\"$node\"})",
              "legendFormat": "{{nodename}} totale"
            },
            {
              "refId": "D",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (nodename) ((node_memory_SwapTotal_bytes - node_memory_SwapFree_bytes) * on (instance) group_left (nodename) node_uname_info{nodename=~\"$node\"})",
              "legendFormat": "{{nodename}} swap"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ],
              "showLegend": true,
              "sortBy": "Max",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "id": 6,
          "gridPos": {
            "x": 0,
            "y": 17,
            "w": 12,
            "h": 8
          }
        },
        {
          "type": "timeseries",
          "title": "Température et throttling",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (nodename) (pi_cpu_temperature_celsius * on (instance) group_left (nodename) node_uname_info{nodename=~\"$node\"})",
              "legendFormat": "{{nodename}} °C"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (nodename) (pi_throttled_throttled * on (instance) group_left (nodename) node_uname_info{nodename=~\"$node\"})",
              "legendFormat": "{{nodename}} throttling"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (nodename) (pi_throttled_under_voltage * on (instance) group_left (nodename) node_uname_info{nodename=~\"$node\"})",
              "legendFormat": "{{nodename}} sous-tension"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "thresholdsStyle": {
                  "mode": "dashed"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 75
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": ".*(throttling|sous-tension)"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "short"
                  },
                  {
                    "id": "custom.axisPlacement",
                    "value": "right"
                  },
                  {
                    "id": "max",
                    "value": 1
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ],
              "showLegend": true,
              "sortBy": "Max",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "id": 7,
          "gridPos": {
            "x": 12,
            "y": 17,
            "w": 12,
            "h": 8
          }
        },
        {
          "type": "timeseries",
          "title": "Disque occupé (temps d'IO)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (nodename, device) (rate(node_disk_io_time_seconds_total{device!~\"ram.*|loop.*|zram.*|dm-.*\"}[5m]) * on (instance) group_left (nodename) node_uname_info{nodename=~\"$node\"})",
              "legendFormat": "{{nodename}} {{device}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ],
              "showLegend": true,
              "sortBy": "Max",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "id": 8,
          "gridPos": {
            "x": 0,
            "y": 25,
            "w": 8,
            "h": 8
          }
        },
        {
          "type": "timeseries",
          "title": "IOPS lecture / écriture",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (nodename, device) (rate(node_disk_reads_completed_total{device!~\"ram.*|loop.*|zram.*|dm-.*\"}[5m]) * on (instance) group_left (nodename) node_uname_info{nodename=~\"$node\"})",
              "legendFormat": "{{nodename}} {{device}} lecture"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (nodename, device) (rate(node_disk_writes_completed_total{device!~\"ram.*|loop.*|zram.*|dm-.*\"}[5m]) * on (instance) group_left (nodename) node_uname_info{nodename=~\"$node\"})",
              "legendFormat": "{{nodename}} {{device}} écriture"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "iops",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ],
              "showLegend": true,
              "sortBy": "Max",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "id": 9,
          "gridPos": {
            "x": 8,
            "y": 25,
            "w": 8,
            "h": 8
          }
        },
        {
          "type": "timeseries",
          "title": "Latence moyenne d'écriture",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
