# Coût et santé de la pile d'observabilité.
# Le JSON ci-dessous est la source du dashboard : le modifier ici (un export Grafana se recolle tel quel).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-42-infra-observability
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: joutio
  annotations:
    grafana_folder: "Infra"
