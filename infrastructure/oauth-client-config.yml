# Client OAuth2 M2M `server-client` (client_credentials) requis par le RestTemplate tokenisé
# du SDK pour interroger les `/command-capabilities` des pairs (bus Axon distribué).
#
# Le secret est fourni par chaque service via le secret scellé
# `SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SERVER_CLIENT_CLIENT_SECRET`.
# Identity n'inclut PAS ce ConfigMap : il déclare sa propre registration (variable
# `JOUTIO_IDENTITY_SERVER_CLIENT_SECRET`) dans `joutio-identity-config`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: joutio-oauth-client-config
  namespace: joutio-prod
data:
  SPRING_APPLICATION_JSON: >-
    {"spring":{"security":{"oauth2":{"client":{"registration":{"server-client":{"provider":"joutio-identity","client-id":"server","client-secret":"${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SERVER_CLIENT_CLIENT_SECRET}","authorization-grant-type":"client_credentials","scope":"openid"}},"provider":{"joutio-identity":{"token-uri":"http://joutio-identity.joutio-prod.svc.cluster.local/oauth2/token","jwk-set-uri":"http://joutio-identity.joutio-prod.svc.cluster.local/oauth2/jwks"}}}}}}}
