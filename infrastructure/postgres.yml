apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: joutio-prod
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: joutio-prod
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # Données locales (local-path) : épinglé au nœud qui porte le volume.
      nodeSelector:
        kubernetes.io/hostname: pi-node1
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          # max_connections=150 : pods Java au maximum (16 avec les HPA) x pool Hikari (5) + marge.
          # pg_stat_statements : requêtes par appels et par temps, lues par postgres-exporter
          # (dashboard `41-infra-data`) ; l'extension est créée par le Job `postgres-extensions`.
          # plan_cache_mode=force_custom_plan : le polling de l'event store d'Axon (`global_index > $1 OR IN (gaps)`)
          # arrive en requête préparée ; en plan générique Postgres parcourt tout l'index (55 ms au lieu de 0,3 ms,
          # 0,49 cœur au repos, campagne #10).
          args:
            - -c
            - plan_cache_mode=force_custom_plan
            - -c
            - max_connections=150
            - -c
            - shared_preload_libraries=pg_stat_statements
            - -c
            - pg_stat_statements.track=all
            - -c
            - pg_stat_statements.max=2000
          envFrom:
            - configMapRef:
                name: joutio-infra-config
            - secretRef:
                name: joutio-infra-secret
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: init
          configMap:
            name: joutio-postgres-init
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
---
# Extensions de la base `postgres` (celle de postgres-exporter), idempotent à chaque sync.
# Les scripts d'init ne tournent qu'à la création du volume : ce Job couvre les bases existantes.
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-extensions
  namespace: joutio-prod
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: psql
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - psql
            - --host=postgres
            - --dbname=postgres
            - --set=ON_ERROR_STOP=1
            - --command=CREATE EXTENSION IF NOT EXISTS pg_stat_statements
          env:
            - name: PGUSER
              valueFrom:
                configMapKeyRef:
                  name: joutio-infra-config
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: joutio-infra-secret
                  key: POSTGRES_PASSWORD
