apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: joutio-profile
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: profile=ghcr.io/joutio/profile
    argocd-image-updater.argoproj.io/profile.update-strategy: semver
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: main
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/joutio/joutio-gitops.git
    targetRevision: main
    path: apps/profile
  destination:
    server: https://kubernetes.default.svc
    namespace: joutio-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
