apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: joutio-matchmaking
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: matchmaking=ghcr.io/joutio/matchmaking
    argocd-image-updater.argoproj.io/matchmaking.update-strategy: semver
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: main
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/joutio/joutio-gitops.git
    targetRevision: main
    path: apps/matchmaking
  destination:
    server: https://kubernetes.default.svc
    namespace: joutio-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
